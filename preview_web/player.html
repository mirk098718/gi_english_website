<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Gleam</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
    p { color: #fff; font: 16px/1.5 sans-serif; padding: 24px; }
  </style>
</head>
<body>
  <iframe
    id="yt"
    title="인강"
    referrerpolicy="strict-origin-when-cross-origin"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen></iframe>
  <script>
    (function () {
      var id = new URLSearchParams(location.search).get('v') || '';
      var frame = document.getElementById('yt');
      if (!/^[A-Za-z0-9_-]{6,64}$/.test(id)) {
        frame.remove();
        var message = document.createElement('p');
        message.textContent = '영상을 찾을 수 없습니다.';
        document.body.appendChild(message);
        return;
      }
      var src = new URL('https://www.youtube.com/embed/' + id);
      src.searchParams.set('rel', '0');
      src.searchParams.set('playsinline', '1');
      src.searchParams.set('origin', location.origin);
      frame.src = src.toString();
    })();
  </script>
</body>
</html>
